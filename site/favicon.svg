<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #2b6a4c; }
    .ring { stroke: #88c9a1; stroke-opacity: 0.45; fill: none; stroke-width: 2.5; }
    .line { stroke: #fbfcf8; fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #88c9a1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16211b; stroke: #88c9a1; stroke-width: 2; }
      .line { stroke: #88c9a1; }
      .dot { fill: #fbfcf8; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="14"/>
  <circle class="ring" cx="32" cy="32" r="21"/>
  <polyline class="line" points="14,41 25,33 33,37 48,21"/>
  <circle class="dot" cx="48" cy="21" r="4.5"/>
</svg>
